<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>WOG PRIDE</title>
</head>
<body class="page">
    <div class="page__container">
        <form class="registration-form">
            <h1 class="registration-form__title">WOG PRIDE</h1>
            
            <div class="form-field">
                <input 
                    class="form-field__input" 
                    id="name" 
                    type="text" 
                    placeholder=" " 
                    required
                >
                <label class="form-field__label form-field__label--float" for="name">
                    Імʼя та Прізвище
                </label>
                <span class="form-field__error">Поле є обов'язковим</span>
            </div>
            
            <button class="registration-form__button" type="submit">
                Увійти
            </button>
            
            <p class="registration-form__footer">
                Ще не маєте акаунт? 
                <a class="registration-form__link" href="#">Створити</a>
            </p>
        </form>
    </div>
</body>
</html>
